events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    client_max_body_size 2m;
    set $backend http://backend:8000;
    set $frontend http://frontend:3000;
    location /api/ { proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /ws/ { proxy_pass $backend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $host; }
    location / { proxy_pass $frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  }
}
